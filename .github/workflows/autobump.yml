name: Update formulae

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-formulae
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git identity
        id: git
        uses: Homebrew/actions/git-user-config@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1

      - name: Open release update pull requests
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git.outputs.email }}
          TAP_NAME: ${{ steps.homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --formulae --bump-synced --tap="$TAP_NAME"

      # Pull requests created with GITHUB_TOKEN do not trigger pull_request
      # workflows. Explicit workflow dispatches do, without a personal token.
      - name: Start checks for update pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .head.repo.full_name == .base.repo.full_name and (.head.ref | startswith("bump-"))) | [.head.ref, .head.sha] | @tsv' \
            > "$RUNNER_TEMP/update-prs.tsv"
          while IFS=$'\t' read -r branch sha; do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml \
              --commit "$sha" --limit 1 --json databaseId --jq 'length')
            if [[ "$runs" == 0 ]]; then
              gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            fi
          done < "$RUNNER_TEMP/update-prs.tsv"
